<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المكتبة الرقمية | RO-BLOG</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05070a;
            --card: #0d1117;
            --primary: #06b6d4;
            --text: #e2e8f0;
            --border: rgba(255,255,255,0.08);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        .back-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
        }
        h1 { font-size: 1.5rem; margin: 20px 0; color: #fff; }
        .search-box {
            width: 100%;
            padding: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            margin-bottom: 25px;
        }
        .doc-list { display: grid; gap: 15px; }
        .doc-item {
            background: var(--card);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .file-icon {
            width: 45px;
            height: 45px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 1.2rem;
        }
        .file-info { flex-grow: 1; }
        .file-info h3 { font-size: 0.9rem; margin: 0; }
        .file-info p { font-size: 0.75rem; color: #94a3b8; margin: 3px 0 0; }
        .dl-icon { color: var(--primary); font-size: 1.1rem; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-link"><i class="fa-solid fa-chevron-right"></i> الرئيسية</a>
        <div style="font-weight:900; letter-spacing:1px;">RO-LIBRARY</div>
    </header>

    <h1>المكتبة الرقمية</h1>
    <input type="text" class="search-box" placeholder="ابحث عن كتالوج أو بحث تقني...">

    <div class="doc-list">
        <div class="doc-item">
            <div class="file-icon"><i class="fa-solid fa-file-pdf"></i></div>
            <div class="file-info">
                <h3>دليل تشغيل أغشية FilmTec</h3>
                <p>PDF • 2.4 MB</p>
            </div>
            <i class="fa-solid fa-download dl-icon"></i>
        </div>

        <div class="doc-item">
            <div class="file-icon"><i class="fa-solid fa-file-pdf"></i></div>
            <div class="file-info">
                <h3>طرق حساب الجرعات الكيميائية</h3>
                <p>PDF • 1.1 MB</p>
            </div>
            <i class="fa-solid fa-download dl-icon"></i>
        </div>

        <div class="doc-item">
            <div class="file-icon" style="background:rgba(59, 130, 246, 0.1); color:#3b82f6;"><i class="fa-solid fa-file-word"></i></div>
            <div class="file-info">
                <h3>نموذج تقرير فني يومي</h3>
                <p>DOCX • 500 KB</p>
            </div>
            <i class="fa-solid fa-download dl-icon"></i>
        </div>
    </div>
</body>
</html>
