```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدونة التناضح العكسي | جاوا ووتر</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #05070a; --card: #0d1117; --primary: #06b6d4; --text: #e2e8f0; --muted: #94a3b8; --border: rgba(255, 255, 255, 0.08); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); }
        header { background: rgba(5,7,10,0.95); padding: 15px 20px; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: 900; color: #fff; }
        .logo span { color: var(--primary); }
        .hero { padding: 60px 20px; text-align: center; background: radial-gradient(circle at top, #0c1e2d 0%, #05070a 100%); }
        .hero h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 15px; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; padding: 20px; }
        
        /* تصميم الروابط كبطاقات */
        .card-link { text-decoration: none; color: inherit; display: block; }
        .card { background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid var(--border); transition: 0.3s; }
        .card:active { transform: scale(0.98); border-color: var(--primary); }
        .card i { color: var(--primary); font-size: 1.5rem; margin-bottom: 15px; display: block; }
        .card h3 { font-size: 1.1rem; margin-bottom: 10px; }
        .card p { font-size: 0.85rem; color: var(--muted); }

        .calc-section { padding: 30px 20px; margin: 20px; background: var(--card); border-radius: 25px; border: 1px solid var(--primary); }
        input { width: 100%; padding: 15px; margin-bottom: 15px; background: #000; border: 1px solid var(--border); border-radius: 12px; color: #fff; }
        button { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: 900; }
        .result { margin-top: 20px; padding: 15px; background: rgba(6,182,212,0.1); border-radius: 12px; display: none; text-align: center; }
        footer { padding: 40px 20px; text-align: center; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--muted); }
    </style>
</head>
<body>
    <header>
        <div class="logo">RO-BLOG<span>.</span></div>
        <i class="fa-solid fa-bars" style="color: var(--primary);"></i>
    </header>

    <section class="hero">
        <h1>هندسة التحلية <br> <span style="color:var(--primary)">في جيبك</span></h1>
        <p>المرجع التقني لمهندسي المياه برعاية جاوا ووتر.</p>
    </section>

    <div class="grid">
        <a href="library.html" class="card-link">
            <div class="card">
                <i class="fa-solid fa-book-open"></i>
                <h3>المكتبة الرقمية</h3>
                <p>تحميل كتالوجات وأبحاث معالجة المياه.</p>
            </div>
        </a>

        <a href="directory.html" class="card-link">
            <div class="card">
                <i class="fa-solid fa-city"></i>
                <h3>دليل الشركات</h3>
                <p>تواصل مع الموردين المعتمدين في المنطقة.</p>
            </div>
        </a>
    </div>

    <section class="calc-section">
        <h2 style="text-align:center; margin-bottom:20px;">حاسبة الجرعة</h2>
        <input type="number" id="flow" placeholder="تدفق التغذية (m³/h)">
        <input type="number" id="dose" placeholder="الجرعة المطلوبة (ppm)">
        <button onclick="calc()">احسب الآن</button>
        <div id="resBox" class="result">
            <h2 id="resVal" style="color: var(--primary);"></h2>
        </div>
    </section>

    <footer><p>© 2024 GAWA WATER TECHNOLOGY</p></footer>

    <script>
        function calc() {
            const f = document.getElementById('flow').value;
            const d = document.getElementById('dose').value;
            if(f && d) {
                const total = (f * d * 24) / 1000;
                document.getElementById('resVal').innerText = total.toFixed(2) + " لتر/يوم";
                document.getElementById('resBox').style.display = 'block';
            }
        }
    </script>
</body>
</html>
