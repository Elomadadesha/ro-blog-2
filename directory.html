<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل الشركات | RO-BLOG</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #05070a;
            --card: #0d1117;
            --primary: #06b6d4;
            --text: #e2e8f0;
            --border: rgba(255,255,255,0.08);
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .home-btn {
            width: 40px;
            height: 40px;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: var(--primary);
            text-decoration: none;
        }
        .page-title { margin-bottom: 30px; }
        .page-title h1 { font-size: 1.6rem; margin: 0; }
        .page-title p { color: #94a3b8; font-size: 0.85rem; margin-top: 5px; }

        .biz-card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .biz-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 4px; height: 100%;
            background: var(--primary);
        }
        .biz-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .biz-logo {
            width: 50px; height: 50px;
            background: #1a222c;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; color: var(--primary);
            border: 1px solid var(--border);
        }
        .biz-name h3 { margin: 0; font-size: 1.1rem; }
        .biz-name span { font-size: 0.7rem; color: #06b6d4; font-weight: 700; text-transform: uppercase; }
        
        .biz-meta { font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px; }
        .biz-meta div { margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-sm {
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .btn-site { background: var(--primary); color: #fff; }
        .btn-call { background: #1a222c; color: #fff; border: 1px solid var(--border); }
    </style>
</head>
<body>
    <header>
        <div style="font-weight:900; color:var(--primary);">RO-DIRECTORY</div>
        <a href="index.html" class="home-btn"><i class="fa-solid fa-house"></i></a>

    <div class="page-title">
        <h1>دليل الشركات</h1>
        <p>الوصول السريع لموردي قطاع تحلية المياه.</p>
    </div>

            </div>
        </div>
        <div class="biz-meta">
            <div><i class="fa-solid fa-location-dot"></i> القاهرة، مصر</div>
            <div><i class="fa-solid fa-box"></i> كيماويات، أغشية، قطع غيار</div>
        </div>
        <div class="action-btns">
            <a href="https://gawaeg.com" class="btn-sm btn-site">الموقع الإلكتروني</a>
            <a href="tel:0123456789" class="btn-sm btn-call">اتصل الآن</a>
        </div>
    </div>
